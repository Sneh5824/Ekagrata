[project]
name = "ekagrata"
version = "0.1.0"
description = "Athlete Digital Twin + Motion Shadow for the badminton forehand smash"
readme = "README.md"
requires-python = "==3.12.*"
# OpenCV is intentionally not listed: mediapipe pulls in opencv-contrib-python,
# and exactly one OpenCV distribution may be installed.
dependencies = [
    "numpy",
    "scipy",
    "pandas",
    "pyarrow",
    "matplotlib",
    "mediapipe",
    "pyserial",
    "pyyaml",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ekagrata"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
